# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 2.2.52

package:
  name: opik
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opik/opik-${{ version }}.tar.gz
  sha256: a3ff057f9e10017da91b8ceaa63de7d75d1a50ecd12a481404575d40125be3b3
  patches:
    # opik's PyPI sdist is the comet-ml/opik monorepo sub-SDK; its setup.py reads
    # ../../README.md (absent from the sdist). Patch long_description="" so
    # metadata generation succeeds. (Version comes from the VERSION env below.)
    - patches/0001-neutralize-out-of-tree-readme.patch

build:
  number: 0
  noarch: python
  script: |
    export VERSION="${PKG_VERSION}"
    ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - boto3-stubs >=1.34.110
    - click
    - httpx
    - rapidfuzz <4.0.0,>=3.0.0
    - openai
    - pydantic-settings !=2.9.0,<3.0.0,>=2.0.0
    - pydantic <3.0.0,>=2.0.0
    - pytest
    - rich
    - sentry-sdk >=2.0.0
    - tenacity
    - tqdm
    - uuid6
    - jinja2
    - watchfiles <2.0.0,>=1.0.0
tests:
  - python:
      imports:
        - opik
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://pypi.org/project/opik/
  license: Apache-2.0
  license_file: LICENSE
  summary: Comet tool for logging and evaluating LLM traces
  repository: https://github.com/comet-ml/opik
  documentation: https://www.comet.com/docs/opik/
  description: |
    Opik is an open-source platform from Comet for evaluating, testing, and
    monitoring LLM applications. This package provides the Python SDK for
    logging and evaluating LLM traces, running evaluations, and integrating
    Opik observability into LLM workflows.

extra:
  recipe-maintainers:
    - rxm7706
